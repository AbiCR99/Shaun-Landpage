<!doctype html>
<!-- Open Graph card (1200×630). Rendered by scripts/make-og.sh. Colors and fonts come from the site's own tokens. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/unbounded/wght.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/jetbrains-mono/wght.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--night-950);

      /* The hand with the lit cigarette (first frame of the Music scene): the ember is the only light */
      .scene {
        position: absolute;
        top: 0;
        left: 470px;
        height: 630px;
        mix-blend-mode: lighten;
        mask-image: linear-gradient(to bottom, black 70%, transparent), linear-gradient(to right, transparent, black 12%);
        mask-composite: intersect;
      }

      .text {
        position: absolute;
        left: 72px;
        bottom: 84px;
      }

      h1 {
        margin: 0 0 28px;
        font-family: var(--font-display);
        font-size: 104px;
        font-weight: 800;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--moon-100);
      }

      h1 span {
        display: block;
      }

      p {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fog-300);
      }
    </style>
  </head>
  <body>
    <img class="scene" src="../../public/media/music/desktop/f001.webp" alt="" />
